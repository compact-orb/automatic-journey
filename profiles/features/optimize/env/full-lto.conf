# Switch from ThinLTO to Full LTO to avoid LLVM thinBackend SSA dominance
# vectorizer crash on non-AVX architectures (such as goldmont-plus).
_full_lto_translate() {
    local var="${1}" from="${2}" to="${3}" new_val="" word
    local val="${!var-}"
    [[ -z "${val}" ]] && return 0
    for word in ${val}; do
        case "${word}" in
            ${from}) new_val="${new_val:+${new_val} }${to}" ;;
            *) new_val="${new_val:+${new_val} }${word}" ;;
        esac
    done
    printf -v "${var}" "%s" "${new_val}"
}

for _var in CFLAGS CXXFLAGS FFLAGS FCFLAGS LDFLAGS; do
    _full_lto_translate "${_var}" "-flto=thin" "-flto"
done
unset -f _full_lto_translate
unset _var
