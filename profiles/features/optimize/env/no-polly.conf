# LLVM Polly vectorizer triggers an internal compiler error in LLVM's verify
# pass during ThinLTO when targeting architectures without wide vector shift
# support (such as goldmont-plus). Strip Polly flags for media-video/ffmpeg.
_strip_polly_flag() {
    local var="${1}" pattern="${2}" new_val="" word
    for word in ${!var}; do
        case "${word}" in
            ${pattern}) ;;
            *) new_val="${new_val:+${new_val} }${word}" ;;
        esac
    done
    printf -v "${var}" "%s" "${new_val}"
}

for _var in CFLAGS CXXFLAGS FFLAGS FCFLAGS; do
    _strip_polly_flag "${_var}" "-Xclang=-mllvm"
    _strip_polly_flag "${_var}" "-Xclang=-polly*"
    _strip_polly_flag "${_var}" "-mllvm"
    _strip_polly_flag "${_var}" "-polly*"
done
unset -f _strip_polly_flag
unset _var
