# Strip Polly to avoid exponential compile time on complex loop nests
for _var in CFLAGS CXXFLAGS FFLAGS FCFLAGS; do
    [[ -n "${!_var-}" ]] || continue
    _opt_strip_flag "${_var}" "-Xclang=-mllvm"
    _opt_strip_flag "${_var}" "-Xclang=-polly*"
    _opt_strip_flag "${_var}" "-mllvm"
    _opt_strip_flag "${_var}" "-polly*"
done
unset _var
