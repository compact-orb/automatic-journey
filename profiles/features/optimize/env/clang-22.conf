# Temporary: pin LLVM 22 for linker-plugin-lto compatibility
export CC="clang-22"
export CXX="clang++-22"
export CPP="clang-cpp-22"
export AS="clang-22 -c"
if [[ -d "${BROOT}/usr/lib/llvm/22/bin" && ":${PATH}:" != *":${BROOT}/usr/lib/llvm/22/bin:"* ]]; then
    export PATH="${BROOT}/usr/lib/llvm/22/bin:${PATH}"
fi
